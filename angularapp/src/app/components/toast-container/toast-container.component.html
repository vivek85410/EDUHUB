<div class="fixed top-20 right-4 z-[100] flex flex-col gap-3 w-full max-w-sm pointer-events-none">
  <div *ngFor="let toast of (toasts$ | async)"
       class="glass-card bg-white rounded-xl shadow-lg border-l-4 p-4 flex items-start gap-3 pointer-events-auto animate-fade-in"
       [ngClass]="borderClassFor(toast.type)">
    <span class="text-xl leading-none">{{ iconFor(toast.type) }}</span>
    <p class="flex-1 text-sm text-gray-800">{{ toast.message }}</p>
    <button (click)="dismiss(toast.id)" class="text-gray-400 hover:text-gray-600 leading-none text-lg">&times;</button>
  </div>
</div>
