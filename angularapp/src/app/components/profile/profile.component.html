<div class="min-h-screen bg-gradient-to-b from-gray-50 to-white">
  <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="text-center mb-8">
      <span class="px-4 py-2 bg-blue-100 text-blue-700 text-sm font-medium rounded-full">Account</span>
      <h1 class="text-3xl font-bold text-gray-900 mt-3">My Profile</h1>
    </div>

    <div *ngIf="isLoading" class="bg-white rounded-2xl p-8 shadow-sm space-y-4">
      <div class="h-24 w-24 skeleton rounded-full mx-auto"></div>
      <div class="h-11 skeleton"></div>
      <div class="h-11 skeleton"></div>
    </div>

    <div *ngIf="!isLoading && profile" class="bg-white rounded-2xl shadow-xl shadow-gray-200/50 border border-gray-100 p-8">
      <div class="flex flex-col items-center mb-8">
        <div class="w-24 h-24 rounded-full overflow-hidden bg-gradient-to-br from-blue-600 to-teal-500 flex items-center justify-center mb-4">
          <img *ngIf="profilePictureUrl" [src]="profilePictureUrl" alt="Profile" class="w-full h-full object-cover"/>
          <span *ngIf="!profilePictureUrl" class="text-white text-3xl font-bold">{{ profile.username.charAt(0) }}</span>
        </div>
        <label class="btn-secondary text-sm cursor-pointer">
          Change Photo
          <input type="file" accept="image/*" class="hidden" (change)="onPictureSelected($event)"/>
        </label>
        <p class="text-xs text-gray-400 mt-2">JPG, PNG, GIF or WebP — max 2MB</p>
      </div>

      <div class="flex items-center gap-2 justify-center mb-6">
        <span class="px-2 py-0.5 text-xs rounded-full bg-blue-200 text-blue-700 font-medium">{{ profile.userRole }}</span>
        <span class="text-sm text-gray-500">{{ profile.email }}</span>
      </div>

      <form #profileForm="ngForm" (ngSubmit)="saveProfile()" class="space-y-5">
        <div>
          <label for="pUsername" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
          <input id="pUsername" name="pUsername" type="text" [(ngModel)]="editUsername" required class="input-field"/>
        </div>
        <div>
          <label for="pMobile" class="block text-sm font-medium text-gray-700 mb-1.5">Mobile Number</label>
          <input id="pMobile" name="pMobile" type="tel" [(ngModel)]="editMobileNumber" required
                 pattern="^[7-9][0-9]{9}$" maxlength="10" class="input-field"
                 placeholder="First digit must be 7, 8 or 9"/>
        </div>
        <button type="submit" [disabled]="profileForm.invalid || isSaving" class="btn-primary w-full">
          {{ isSaving ? 'Saving...' : 'Save Changes' }}
        </button>
      </form>
    </div>
  </div>
</div>
