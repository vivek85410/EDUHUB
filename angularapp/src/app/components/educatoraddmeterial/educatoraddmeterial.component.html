<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-indigo-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl mx-auto">
      <div class="text-center mb-8 animate-fade-in">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-blue-600 to-teal-500 rounded-2xl shadow-lg shadow-blue-500/20 mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-900">Add Course Material</h1>
        <p class="mt-2 text-gray-500">Upload or link learning materials for your courses</p>
      </div>
  
      <div class="bg-white rounded-2xl shadow-xl shadow-gray-200/50 border border-gray-100 p-8 animate-fade-in">
        <form class="space-y-5">
          <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1.5">Title</label>
            <input id="title" name="title" type="text" class="input-field" placeholder="e.g. Lecture Notes Chapter 1" />
          </div>
  
          <div>
            <label for="materialType" class="block text-sm font-medium text-gray-700 mb-1.5">Material Type</label>
            <select id="materialType" name="materialType" class="select-field">
              <option value="">Select type</option>
              <option value="url">URL Link</option>
              <option value="file">File Upload</option>
              <option value="video">Video</option>
              <option value="document">Document</option>
            </select>
          </div>
  
          <div>
            <label for="materialUrl" class="block text-sm font-medium text-gray-700 mb-1.5">URL (Optional)</label>
            <input id="materialUrl" name="materialUrl" type="url" class="input-field" placeholder="https://example.com/material" />
          </div>
  
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Or Upload File</label>
            <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-200 border-dashed rounded-2xl hover:border-blue-300 transition-colors cursor-pointer">
              <div class="text-center">
                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                  <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <p class="mt-2 text-sm text-gray-600">
                  <span class="font-medium text-blue-600 hover:text-blue-500">Click to upload</span> or drag and drop
                </p>
                <p class="text-xs text-gray-500 mt-1">PDF, PPT, DOC, Images, MP4 up to 1GB</p>
              </div>
            </div>
          </div>
  
          <div class="flex items-center gap-3 pt-2">
            <button type="submit" class="btn-primary">Add Material</button>
            <button type="button" class="btn-ghost">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
