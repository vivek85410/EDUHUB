<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-indigo-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl mx-auto">
      <div class="text-center mb-8 animate-fade-in">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-blue-600 to-teal-500 rounded-2xl shadow-lg shadow-blue-500/20 mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-900">Add Feedback</h1>
        <p class="mt-2 text-gray-500">Share your thoughts and help us improve</p>
      </div>
  
      <div *ngIf="message" class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-sm mb-6 flex items-center gap-2 animate-slide-down">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ message }}
      </div>
  
      <div class="bg-white rounded-2xl shadow-xl shadow-gray-200/50 border border-gray-100 p-8 animate-fade-in">
        <form (ngSubmit)="submitFeedback()" class="space-y-5">
          <div>
            <label for="feedback" class="block text-sm font-medium text-gray-700 mb-2">Your Feedback</label>
            <textarea
              id="feedback"
              name="feedback"
              [(ngModel)]="feedbackText"
              rows="5"
              required
              class="input-field resize-none"
              placeholder="Tell us about your experience... What did you like? What can we improve?"
            ></textarea>
          </div>
          <div class="flex items-center gap-3">
            <button type="submit" 
                    class="btn-primary"
                    [disabled]="!feedbackText.trim() || isLoading">
              <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
              {{ isLoading ? 'Submitting...' : 'Submit Feedback' }}
            </button>
            <a routerLink="/home" class="btn-ghost">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
