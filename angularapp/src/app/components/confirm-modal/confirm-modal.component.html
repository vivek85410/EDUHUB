<div *ngIf="(request$ | async) as req"
     class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[110] flex items-center justify-center p-4">
  <div class="glass-card bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl animate-fade-in">
    <h3 class="text-lg font-semibold text-gray-900 mb-2">{{ req.title }}</h3>
    <p class="text-sm text-gray-600 mb-6">{{ req.message }}</p>
    <div class="flex justify-end gap-3">
      <button (click)="respond(false)" class="btn-ghost">Cancel</button>
      <button (click)="respond(true)" class="btn-danger">Confirm</button>
    </div>
  </div>
</div>
