<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-indigo-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full animate-fade-in">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-blue-600 to-teal-500 rounded-2xl shadow-lg shadow-blue-500/20 mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-gray-900">Checkout</h1>
      <p class="text-gray-500 mt-2">Enrolling in <strong>{{ courseTitle }}</strong> — ₹{{ amount }}</p>
      <p class="text-xs text-gray-400 mt-1">This is a mock payment for demo purposes only. No real transaction occurs.</p>
    </div>

    <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm mb-6">
      {{ errorMessage }}
    </div>

    <div class="bg-white rounded-2xl shadow-xl shadow-gray-200/50 border border-gray-100 p-8">
      <form #payForm="ngForm" (ngSubmit)="pay()" class="space-y-5">
        <div>
          <label for="cardName" class="block text-sm font-medium text-gray-700 mb-1.5">Name on Card</label>
          <input id="cardName" name="cardName" type="text" [(ngModel)]="cardName" required class="input-field" placeholder="John Doe"/>
        </div>
        <div>
          <label for="cardNumber" class="block text-sm font-medium text-gray-700 mb-1.5">Card Number</label>
          <input id="cardNumber" name="cardNumber" type="text" [(ngModel)]="cardNumber" required maxlength="19" class="input-field" placeholder="1234 5678 9012 3456"/>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="expiry" class="block text-sm font-medium text-gray-700 mb-1.5">Expiry (MM/YY)</label>
            <input id="expiry" name="expiry" type="text" [(ngModel)]="expiry" required maxlength="5" class="input-field" placeholder="12/28"/>
          </div>
          <div>
            <label for="cvv" class="block text-sm font-medium text-gray-700 mb-1.5">CVV</label>
            <input id="cvv" name="cvv" type="password" [(ngModel)]="cvv" required maxlength="4" class="input-field" placeholder="123"/>
          </div>
        </div>
        <button type="submit" [disabled]="payForm.invalid || isProcessing" class="btn-primary w-full">
          <svg *ngIf="isProcessing" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          {{ isProcessing ? 'Processing...' : 'Pay ₹' + amount }}
        </button>
      </form>
    </div>
  </div>
</div>
